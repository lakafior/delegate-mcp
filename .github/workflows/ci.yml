name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run swift test
        # Zawieszony test (np. atrapa agenta ACP) ma skończyć się błędem, a nie godziną czekania.
        timeout-minutes: 10
        run: swift test

      - name: Build production app
        run: ./scripts/build-app.sh
