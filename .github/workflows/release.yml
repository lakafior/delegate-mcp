name: Release

# Wydanie po wypchnięciu taga, np. `git tag v0.2.0 && git push origin v0.2.0`.
# Tag musi zgadzać się z `let version` w Sources/delegate-mcp/main.swift.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # numer kompilacji = liczba commitów

      - name: Check that the tag matches the code version
        run: |
          VERSION="$(sed -nE 's/^let version = "([^"]+)"/\1/p' Sources/delegate-mcp/main.swift)"
          echo "Code version: $VERSION, tag: $TAG"
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "::error::Tag $TAG doesn't match version $VERSION in Sources/delegate-mcp/main.swift"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run swift test
        run: swift test

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::Secret DEVELOPER_ID_P12_BASE64 is missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$SIGN_ID" ]]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $SIGN_ID"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Write notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" ]]; then
            echo "::error::Secret NOTARY_KEY_P8_BASE64 is missing"
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: ./scripts/build-app.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/notarize.sh dist/Delegate.app

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ./scripts/make-dmg.sh
          ./scripts/notarize.sh dist/Delegate.dmg
          mv dist/Delegate.dmg "dist/Delegate-$VERSION.dmg"
          (cd dist && shasum -a 256 "Delegate-$VERSION.dmg" > "Delegate-$VERSION.dmg.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/Delegate-$VERSION.dmg" "dist/Delegate-$VERSION.dmg.sha256" \
            --title "Delegate $VERSION" --generate-notes --verify-tag

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
